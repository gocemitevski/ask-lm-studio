# Publishes a GitHub Release whenever a version tag (v*) is pushed:
#   git tag v1.0.2 && git push origin main v1.0.2
# The release notes are generated automatically: intro + "Changes since
# <previous tag>" (git log of the tag range) + Requirements/Install.
# No manual editing per release — just push the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, needed to find the previous tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint (fails on errors)
        run: npx --yes web-ext lint

      - name: Build zip
        run: npx --yes web-ext build --overwrite-dest

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Nearest tag reachable from this tag's parent (empty on first release)
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            HEADER="Changes since ${PREV}"
            CHANGES=$(git log --no-merges --pretty=format:'- %s ([%h](https://github.com/'"${REPO}"'/commit/%H))' "${PREV}..${TAG}" || true)
          else
            HEADER="Changes"
            CHANGES=""
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="- First release."
          fi
          {
            printf '%s\n\n' "Local-first AI chat in the Firefox sidebar — talks directly to LM Studio's OpenAI-compatible server."
            printf '## %s\n\n' "$HEADER"
            printf '%s\n\n' "$CHANGES"
            cat <<'EOF'
          ## Requirements
          - Firefox 140+ (149+ for the enterprise policy)
          - LM Studio running a local model (default `http://localhost:1234/v1`)

          ## Install
          Download the zip, then `about:debugging → This Firefox → Load Temporary Add-on…` and pick `manifest.json` inside the zip (temporary until signed on AMO).

          Full setup guide: the README.
          EOF
          } > "$RUNNER_TEMP/notes.md"
          echo "--- notes.md ---"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Ask LM Studio ${{ github.ref_name }}
          files: web-ext-artifacts/*.zip
          body_path: ${{ runner.temp }}/notes.md
